# ───────────────────────────────────────────────────────
# 🏅 AlgoArcade — Award Daily TSP Medals
# ───────────────────────────────────────────────────────
# Runs every day at 00:05 UTC to evaluate the previous
# day's leaderboard and award gold/silver/bronze medals
# to the top 3 players.
# ───────────────────────────────────────────────────────

name: Award Daily TSP Medals

on:
  schedule:
    # Every day at 00:05 UTC (after daily challenge generation)
    - cron: '5 0 * * *'

  workflow_dispatch:

jobs:
  award:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: ./scripts

      - name: Award medals
        run: node award-daily-medals.js
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
