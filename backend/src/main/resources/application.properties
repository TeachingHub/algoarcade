# Application configuration
spring.application.name=backend

# Server configuration
server.port=8080

# Firebase configuration
firebase.config.path=firebase-service-account.json
firebase.api.key=${FIREBASE_API_KEY}

# Logging configuration
logging.level.com.tfg.danielsantos.backend=DEBUG
logging.level.com.google.firebase=INFO
logging.level.org.springframework.security=DEBUG

# Management endpoints (opcional para monitoreo)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# JVM settings (opcional)
spring.jpa.open-in-view=false
